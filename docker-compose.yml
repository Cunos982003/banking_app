services:
  core-db:
    image: postgres:15
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_pass
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  account-service:
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/banking_db
      SPRING_DATASOURCE_USERNAME: bank_user
      SPRING_DATASOURCE_PASSWORD: bank_pass
      PASSWORD: bank_pass
      DB_HOST: core-db
      DB_PORT: 5432
    depends_on:
      core-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - banking-network

  transaction-service:
    build:
      context: ./transaction-service
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8080
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - banking-network

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "80:80"
    depends_on:
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  banking-network:
    driver: bridge

volumes:
  pg-data:
    driver: local
