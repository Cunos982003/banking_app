server.port=8080

# Datasource - environment-overridable
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://core-db:5432/banking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bank_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bank_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate not modify schema by default; change as needed
spring.jpa.hibernate.ddl-auto=none

# Hikari logging so startup shows successful connection
logging.level.com.zaxxer.hikari=INFO
spring.datasource.hikari.connection-timeout=30000
